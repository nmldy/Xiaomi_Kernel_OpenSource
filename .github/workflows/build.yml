name: Build Merlin Kernel with KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf automake xz-utils bc python3 git zlib1g-dev lz4 git gcc-aarch64-linux-gnu cpio device-tree-compiler

    - name: Setup KernelSU v0.9.5
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -

    - name: Configure
      run: |
        make ARCH=arm64 merlin_defconfig
        # 强制开启 KernelSU 所有依赖
        ./scripts/config --file .config --enable CONFIG_MODULES
        ./scripts/config --file .config --enable CONFIG_MODULE_UNLOAD
        ./scripts/config --file .config --enable CONFIG_KPROBES
        ./scripts/config --file .config --enable CONFIG_HAVE_KPROBES
        ./scripts/config --file .config --enable CONFIG_KPROBE_EVENTS
        ./scripts/config --file .config --enable CONFIG_KSU
        ./scripts/config --file .config --enable CONFIG_KSU_DEBUG
        # 关闭可能导致错误的选项
        ./scripts/config --file .config --disable CONFIG_IKHEADERS

    - name: Build
      run: |
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

    - name: Package
      run: |
        mkdir -p out
        cp arch/arm64/boot/Image.gz-dtb out/ || cp arch/arm64/boot/Image out/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/
