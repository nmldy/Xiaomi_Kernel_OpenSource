name: Build Kernel with KernelSU

on:
  push:
    branches: [ "merlin-r-oss" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf automake xz-utils bc python3 git zlib1g-dev lz4 git gcc-aarch64-linux-gnu

    - name: Setup KernelSU (v0.9.5 for non-GKI)
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -

    - name: Load defconfig
      run: |
        make ARCH=arm64 merlin_defconfig
        echo "CONFIG_KSU=y" >> .config
        echo "CONFIG_KSU_DEBUG=y" >> .config

    - name: Build kernel
      run: |
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

    - name: Package output
      run: |
        mkdir -p out
        cp arch/arm64/boot/Image.gz-dtb out/ || cp arch/arm64/boot/Image out/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: out/
