​ name: Build Merlin Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        repository: nmldy/Xiaomi_Kernel_OpenSource
        ref: merlin-r-oss
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 cpio u-boot-tools

    - name: Setup Toolchains
      run: |
        # 下载 AOSP Clang
        mkdir -p $HOME/clang && cd $HOME/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902b.tar.gz -O clang.tar.gz
        tar -xzf clang.tar.gz && rm clang.tar.gz
        echo "$HOME/clang/bin" >> $GITHUB_PATH

        # 下载 GCC
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $HOME/gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $HOME/gcc32

    - name: Inject ReSukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Modify Defconfig
      run: |
        # 寻找并修改 defconfig
        DEFCONFIG=$(find arch/arm64/configs -name "*merlin*defconfig" | head -n 1)
        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG=$(find arch/arm64/configs -name "*k68*defconfig" | head -n 1)
        fi
        echo "Using config: $DEFCONFIG"
        echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
        echo "CONFIG_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> $DEFCONFIG

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$HOME/gcc64/bin:$HOME/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*merlin*defconfig" | head -n 1) .defconfig)
        if [ -z "$DEFCONFIG_NAME" ]; then
          DEFCONFIG_NAME=$(basename $(find arch/arm64/configs -name "*k68*defconfig" | head -n 1) .defconfig)
        fi
        
        make O=out ARCH=arm64 $DEFCONFIG_NAME
        make O=out ARCH=arm64 -j$(nproc) 2>&1 | tee build.log

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Merlin_Kernel_AnyKernel3.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Merlin-Kernel
        path: Merlin_Kernel_AnyKernel3.zip
